<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="535" viewBox="0 0 1100 535" role="img" aria-labelledby="title desc"><title id="title">More symmetry can be the wrong augmentation</title><desc id="desc">The task requires rotations from C4. Reflections can leave a chiral pattern’s rotation orbit. All seven reasoning Atria failures add reflections; its two successes sample only rotations.</desc><rect width="1100" height="535" fill="#f8f5ed"/><g font-family="Segoe UI, Arial, sans-serif"><text x="42" y="51" font-size="29" fill="#203842" font-weight="700">More symmetry can be the wrong augmentation</text><text x="42" y="88" font-size="20" fill="#607078" >functorial_augmentation · the judge accepts C₄ rotations; the public group contract is vague</text><rect x="42" y="115" width="670" height="203" rx="12" fill="#eceee7"/><text x="65" y="151" font-size="23" fill="#167d8c" font-weight="700">Judge accepts: four rotations</text><g transform="translate(119 221)"><rect x="-43" y="-43" width="86" height="86" rx="8" fill="#e6ebe6"/><g transform="rotate(0) scale(1 1)"><path d="M -22 -27 L 22 -27 L 22 -13 L -6 -13 L -6 -1 L 12 -1 L 12 13 L -6 13 L -6 29 L -22 29 Z" fill="#167d8c"/></g></g><text x="101" y="289" font-size="19" fill="#607078" >0°</text><g transform="translate(280 221)"><rect x="-43" y="-43" width="86" height="86" rx="8" fill="#e6ebe6"/><g transform="rotate(90) scale(1 1)"><path d="M -22 -27 L 22 -27 L 22 -13 L -6 -13 L -6 -1 L 12 -1 L 12 13 L -6 13 L -6 29 L -22 29 Z" fill="#167d8c"/></g></g><text x="262" y="289" font-size="19" fill="#607078" >90°</text><g transform="translate(441 221)"><rect x="-43" y="-43" width="86" height="86" rx="8" fill="#e6ebe6"/><g transform="rotate(180) scale(1 1)"><path d="M -22 -27 L 22 -27 L 22 -13 L -6 -13 L -6 -1 L 12 -1 L 12 13 L -6 13 L -6 29 L -22 29 Z" fill="#167d8c"/></g></g><text x="423" y="289" font-size="19" fill="#607078" >180°</text><g transform="translate(602 221)"><rect x="-43" y="-43" width="86" height="86" rx="8" fill="#e6ebe6"/><g transform="rotate(270) scale(1 1)"><path d="M -22 -27 L 22 -27 L 22 -13 L -6 -13 L -6 -1 L 12 -1 L 12 13 L -6 13 L -6 29 L -22 29 Z" fill="#167d8c"/></g></g><text x="584" y="289" font-size="19" fill="#607078" >270°</text><rect x="737" y="115" width="321" height="203" rx="12" fill="#eceee7"/><text x="760" y="151" font-size="20" fill="#cc6946" font-weight="700">Reflection adds a new orbit</text><g transform="translate(896 221)"><rect x="-43" y="-43" width="86" height="86" rx="8" fill="#e6ebe6"/><g transform="rotate(0) scale(-1 1)"><path d="M -22 -27 L 22 -27 L 22 -13 L -6 -13 L -6 -1 L 12 -1 L 12 13 L -6 13 L -6 29 L -22 29 Z" fill="#cc6946"/></g></g><text x="788" y="291" font-size="20" fill="#607078" >A larger D₄ action</text><text x="42" y="365" font-size="24" fill="#167d8c" font-weight="700">Reasoning Atria</text><text x="320" y="365" font-size="23" fill="#203842" >2/9 PASS: C₄ only · 7/9 FAIL: reflections added</text><text x="42" y="415" font-size="24" fill="#cc6946" font-weight="700">Mercury</text><text x="320" y="415" font-size="23" fill="#203842" >0/9: API errors &amp; unsuccessful rotation sampling</text><line x1="42" y1="451" x2="1058" y2="451" stroke="#d8ded9" stroke-width="2"/><text x="42" y="490" font-size="20" fill="#607078" >The prompt should specify the allowed group. Reflection need not preserve a rotation orbit.</text></g></svg>