<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="580" viewBox="0 0 1100 580" role="img" aria-labelledby="title desc"><title id="title">A lookahead finds a window. It consumes no text.</title><desc id="desc">Rule 110 updates input 010 with zero boundaries. Windows 001 010 100 map to 110. Direct zero-width replacement inserts these bits into the retained padded input, producing 10100100 instead of 110.</desc><rect width="1100" height="580" fill="#f8f5ed"/><g font-family="Segoe UI, Arial, sans-serif"><text x="42" y="51" font-size="29" fill="#203842" font-weight="700">A lookahead finds a window. It consumes no text.</text><text x="42" y="88" font-size="20" fill="#607078" >regex_state_machine · a three-cell example of Atria’s recurring replacement error</text><rect x="42" y="118" width="1016" height="99" rx="12" fill="#eceee7"/><text x="64" y="158" font-size="26" fill="#203842" >Input: 010    →    pad: 00100    →    windows: 001 | 010 | 100</text><text x="64" y="195" font-size="24" fill="#167d8c" >Rule 110:                                                    1       1       0</text><rect x="42" y="242" width="491" height="201" rx="12" fill="#eceee7"/><rect x="556" y="242" width="502" height="201" rx="12" fill="#eceee7"/><text x="64" y="282" font-size="25" fill="#167d8c" font-weight="700">Construct a new output</text><text x="64" y="325" font-size="22" fill="#203842" >Collect only the successor bits.</text><text x="64" y="386" font-size="42" fill="#167d8c" font-weight="700" letter-spacing="10">110</text><text x="579" y="282" font-size="24" fill="#cc6946" font-weight="700">Replace zero-width matches</text><text x="579" y="325" font-size="21" fill="#203842" >Insert bits; retain the original input.</text><text x="579" y="386" font-size="37" fill="#cc6946" font-weight="700" letter-spacing="4">10100100</text><text x="42" y="488" font-size="24" fill="#203842" >Expected N cells. Direct insertion yields 2N + 2 after zero padding.</text><text x="42" y="533" font-size="19" fill="#607078" >The archive records 512 → 1026 and 32 → 66. Mercury’s two-pass marker extraction avoids this.</text></g></svg>