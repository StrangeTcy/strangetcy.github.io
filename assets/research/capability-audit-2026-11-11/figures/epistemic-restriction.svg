<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="580" viewBox="0 0 1100 580" role="img" aria-labelledby="title desc"><title id="title">Both models carry out the public model update</title><desc id="desc">In the inspected four-world chained example, the first announcement removes w3, the second removes w1, leaving w2 and w4. Both models then restrict accessibility cells before evaluating nested knowledge.</desc><rect width="1100" height="580" fill="#f8f5ed"/><g font-family="Segoe UI, Arial, sans-serif"><text x="42" y="51" font-size="29" fill="#203842" font-weight="700">Both models carry out the public model update</text><text x="42" y="87" font-size="20" fill="#607078" >Public announcements · one inspected chained / nested case</text><text x="42" y="154" font-size="25" fill="#203842" >Start</text><circle cx="662" cy="149" r="28" fill="#167d8c"/><text x="662" y="156" font-size="21" fill="#ffffff" text-anchor="middle">w1</text><circle cx="751" cy="149" r="28" fill="#167d8c"/><text x="751" y="156" font-size="21" fill="#ffffff" text-anchor="middle">w2</text><circle cx="840" cy="149" r="28" fill="#167d8c"/><text x="840" y="156" font-size="21" fill="#ffffff" text-anchor="middle">w3</text><circle cx="929" cy="149" r="28" fill="#167d8c"/><text x="929" y="156" font-size="21" fill="#ffffff" text-anchor="middle">w4</text><line x1="42" y1="199" x2="1058" y2="199" stroke="#d8ded9" stroke-width="2"/><text x="42" y="246" font-size="23" fill="#203842" >Bek knows the radio check-in happened</text><circle cx="662" cy="241" r="28" fill="#167d8c"/><text x="662" y="248" font-size="21" fill="#ffffff" text-anchor="middle">w1</text><circle cx="751" cy="241" r="28" fill="#167d8c"/><text x="751" y="248" font-size="21" fill="#ffffff" text-anchor="middle">w2</text><circle cx="840" cy="241" r="28" fill="#d8ded9"/><text x="840" y="248" font-size="21" fill="#607078" text-anchor="middle">w3</text><circle cx="929" cy="241" r="28" fill="#167d8c"/><text x="929" y="248" font-size="21" fill="#ffffff" text-anchor="middle">w4</text><line x1="42" y1="291" x2="1058" y2="291" stroke="#d8ded9" stroke-width="2"/><text x="42" y="337" font-size="23" fill="#203842" >The cache was not moved</text><circle cx="662" cy="332" r="28" fill="#d8ded9"/><text x="662" y="339" font-size="21" fill="#607078" text-anchor="middle">w1</text><circle cx="751" cy="332" r="28" fill="#167d8c"/><text x="751" y="339" font-size="21" fill="#ffffff" text-anchor="middle">w2</text><circle cx="840" cy="332" r="28" fill="#d8ded9"/><text x="840" y="339" font-size="21" fill="#607078" text-anchor="middle">w3</text><circle cx="929" cy="332" r="28" fill="#167d8c"/><text x="929" y="339" font-size="21" fill="#ffffff" text-anchor="middle">w4</text><rect x="42" y="390" width="1016" height="106" rx="12" fill="#eceee7"/><text x="64" y="430" font-size="25" fill="#167d8c" font-weight="700">Restrict accessibility as well as worlds.</text><text x="64" y="471" font-size="23" fill="#203842" >Bek’s surviving cells are singletons; Anders’s cell is {w₂, w₄}.</text><text x="42" y="545" font-size="20" fill="#607078" >Both: 6/6 announcements &amp; 6/6 nested knowledge. Evidence for small, explicit finite models.</text></g></svg>