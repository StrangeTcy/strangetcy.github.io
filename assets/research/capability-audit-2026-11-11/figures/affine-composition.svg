<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="550" viewBox="0 0 1100 550" role="img" aria-labelledby="title desc"><title id="title">Composition order is not associativity</title><desc id="desc">Applying update one then update two yields M2 times M1 x plus M2 times u1 plus u2. Both chronological and opposite composition are associative. Four Mercury repairs confused elementwise and matrix representations.</desc><rect width="1100" height="550" fill="#f8f5ed"/><g font-family="Segoe UI, Arial, sans-serif"><text x="42" y="51" font-size="29" fill="#203842" font-weight="700">Composition order is not associativity</text><text x="42" y="88" font-size="20" fill="#607078" >ssm_parallel_scan · the arrays encode elementwise / diagonal operators</text><rect x="42" y="119" width="1016" height="109" rx="12" fill="#eceee7"/><text x="65" y="159" font-size="31" fill="#203842" >x  →  M₁ ⊙ x + u₁  →  M₂ ⊙ (M₁ ⊙ x + u₁) + u₂</text><text x="65" y="204" font-size="27" fill="#167d8c" >Composite:  (u, M) = (M₂ ⊙ u₁ + u₂, M₂ ⊙ M₁)</text><rect x="42" y="251" width="486" height="178" rx="12" fill="#eceee7"/><rect x="550" y="251" width="508" height="178" rx="12" fill="#eceee7"/><text x="65" y="290" font-size="25" fill="#203842" font-weight="700">Chronological contract</text><text x="65" y="332" font-size="22" fill="#203842" >Which update happens first?</text><text x="65" y="368" font-size="21" fill="#607078" >The starter gets that order wrong.</text><text x="65" y="404" font-size="19" fill="#607078" >Its reverse-order rule is still associative.</text><text x="573" y="290" font-size="25" fill="#203842" font-weight="700">Representation contract</text><text x="573" y="332" font-size="21" fill="#203842" >⊙ is elementwise; @ is matrix multiply.</text><text x="573" y="368" font-size="21" fill="#cc6946" >All 4 Mercury failures substitute @.</text><text x="573" y="404" font-size="21" fill="#167d8c" >Atria preserves ⊙ in all 9 cases.</text><text x="42" y="472" font-size="23" fill="#203842" >Mercury: 5/9 · Reasoning Atria: 9/9</text><text x="42" y="511" font-size="20" fill="#607078" >A familiar abstract formula still has to match the concrete tensor representation.</text></g></svg>