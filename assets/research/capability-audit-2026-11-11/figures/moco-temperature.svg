<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="555" viewBox="0 0 1100 555" role="img" aria-labelledby="title desc"><title id="title">Temperature sensitivity is a weaker test than correctness</title><desc id="desc">Relative logits should scale as one over relative temperature. Scaling both normalized query and key produces inverse-square scaling. The current probe accepts any non-cancelled sensitivity.</desc><rect width="1100" height="555" fill="#f8f5ed"/><g font-family="Segoe UI, Arial, sans-serif"><text x="42" y="51" font-size="29" fill="#203842" font-weight="700">Temperature sensitivity is a weaker test than correctness</text><text x="42" y="89" font-size="20" fill="#607078" >MoCo · normalized positive-pair similarity, relative to τ = τ₀</text><line x1="93" y1="425" x2="553" y2="425" stroke="#d8ded9" stroke-width="2"/><text x="66" y="431" font-size="18" fill="#607078" >0</text><line x1="93" y1="357" x2="553" y2="357" stroke="#d8ded9" stroke-width="2"/><text x="66" y="363" font-size="18" fill="#607078" >1</text><line x1="93" y1="289" x2="553" y2="289" stroke="#d8ded9" stroke-width="2"/><text x="66" y="295" font-size="18" fill="#607078" >2</text><line x1="93" y1="221" x2="553" y2="221" stroke="#d8ded9" stroke-width="2"/><text x="66" y="227" font-size="18" fill="#607078" >3</text><line x1="93" y1="153" x2="553" y2="153" stroke="#d8ded9" stroke-width="2"/><text x="66" y="159" font-size="18" fill="#607078" >4</text><text x="80" y="455" font-size="18" fill="#607078" >0.5</text><text x="233.33333333333331" y="455" font-size="18" fill="#607078" >1</text><text x="386.66666666666663" y="455" font-size="18" fill="#607078" >1.5</text><text x="540" y="455" font-size="18" fill="#607078" >2</text><path d="M93.00,289.00 L98.11,293.39 L103.22,297.50 L108.33,301.36 L113.44,305.00 L118.56,308.43 L123.67,311.67 L128.78,314.73 L133.89,317.63 L139.00,320.38 L144.11,323.00 L149.22,325.49 L154.33,327.86 L159.44,330.12 L164.56,332.27 L169.67,334.33 L174.78,336.30 L179.89,338