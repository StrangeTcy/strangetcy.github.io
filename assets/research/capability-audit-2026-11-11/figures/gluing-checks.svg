<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="470" viewBox="0 0 1100 470" role="img" aria-labelledby="title desc"><title id="title">A 0–9 score split, located in one check</title><desc id="desc">Both models passed local, global gluing and monotonicity checks in all nine cases. Only Mercury failed all nine non-finite robustness checks.</desc><rect width="1100" height="470" fill="#f8f5ed"/><g font-family="Segoe UI, Arial, sans-serif"><text x="42" y="51" font-size="29" fill="#203842" font-weight="700">A 0–9 score split, located in one check</text><text x="42" y="87" font-size="20" fill="#607078" >sheaf_invariant_gluing · PASS requires all four checks</text><text x="640" y="132" font-size="22" fill="#cc6946" font-weight="700">Mercury</text><text x="840" y="132" font-size="22" fill="#167d8c" font-weight="700">Reasoning Atria</text><rect x="42" y="145" width="1016" height="50" rx="12" fill="#eceee7"/><text x="62" y="177" font-size="23" fill="#203842" >Ordinary inputs</text><text x="663" y="177" font-size="25" fill="#316a54" font-weight="700">9/9</text><text x="897" y="177" font-size="25" fill="#316a54" font-weight="700">9/9</text><rect x="42" y="207" width="1016" height="50" rx="12" fill="#eceee7"/><text x="62" y="239" font-size="23" fill="#203842" >Global boundary / gluing</text><text x="663" y="239" font-size="25" fill="#316a54" font-weight="700">9/9</text><text x="897" y="239" font-size="25" fill="#316a54" font-weight="700">9/9</text><rect x="42" y="269" width="1016" height="50" rx="12" fill="#eceee7"/><text x="62" y="301" font-size="23" fill="#203842" >Monotonicity</text><text x="663" y="301" font-size="25" fill="#316a54" font-weight="700">9/9</text><text x="897" y="301" font-size="25" fill="#316a54" font-weight="700">9/9</text><rect x="42" y="331" width="1016" height="50" rx="12" fill="#eceee7"/><text x="62" y="363" font-size="23" fill="#203842" >NaN &amp; infinity robustness</text><text x="663" y="363" font-size="25" fill="#cc6946" font-weight="700">0/9</text><text x="897" y="363" font-size="25" fill="#316a54" font-weight="700">9/9</text><text x="42" y="446" font-size="20" fill="#607078" >Both repair the range defect. Mercury still converts NaN to an integer before clamping.</text></g></svg>