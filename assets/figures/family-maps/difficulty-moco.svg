<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="1138" viewBox="0 0 1100 1138" role="img" aria-labelledby="title description">
  <title id="title">MoCo: more cases, still no isolated axis</title>
  <desc id="description">All 15 recorded Mercury-2.5 MoCo difficulty tuples. The six columns show distractors, naming, queue_math, symptom_mask, temperature, and visible_tests. Separate bars show recorded PASS and FAIL counts; numbers give PASS over scored cases. The three highlighted examples have easy distractors and naming, but queue_math, symptom_mask, temperature and visible_tests all change together. Across all 15 tuples, no pair holds the other five settings fixed while changing visible_tests. Totals are 36 PASS and 19 FAIL across 55 cases: 15 bases and 40 intervention variants, all recorded at seed 0 under behavioral-reference judging. These fractions are descriptive, not independent replications or a difficulty curve.</desc>
  <defs>
    <g id="easy"><rect width="100" height="34" rx="6" fill="#e3efec"/><text x="50" y="23" text-anchor="middle" fill="#235a53">easy</text></g>
    <g id="medium"><rect width="100" height="34" rx="6" fill="#ece8f2"/><text x="50" y="23" text-anchor="middle" fill="#5a4f70">medium</text></g>
    <g id="hard"><rect width="100" height="34" rx="6" fill="#f4e8d6"/><text x="50" y="23" text-anchor="middle" fill="#7a5a2e">hard</text></g>
  </defs>
