<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="730" viewBox="0 0 1120 730" role="img" aria-labelledby="title desc"><title id="title">Similar pass fractions from disjoint environment pools</title><desc id="desc">Atria-Dawn-Preview recorded 131 PASS in 189 cases under behavioral_reference, 69.3 percent, across 11 environments. It recorded 159 PASS in 226 cases under compile_only, 70.4 percent, across 27 other environments. Zero environments were judged under both guarantees. The similarity of pooled fractions is not evidence of agreement on matched cases.</desc><style>text{font-family:Arial,Helvetica,sans-serif;fill:#23313a}.muted{fill:#647078}.bold{font-weight:700}.pass{fill:#197d70}</style><rect width="1120" height="730" fill="#faf9f6"/><text x="40" y="53" font-size="31" class="bold">Two similar fractions, two different pools</text><text x="40" y="88" font-size="20" class="muted">Atria-Dawn-Preview · recorded verdicts · reasoning effort high · seed 0</text><path d="M40 115H1080" stroke="#d9ddd9"/>
