<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="610" viewBox="0 0 1040 610" role="img" aria-labelledby="title desc">
<title id="title">Regex input and output lengths</title>
<desc id="desc">The main scatterplot compares input string length with returned string length. Easy-surface results lie on the equal-length diagonal at 32, 128, and 512. A close-up for input length 32 shows easy output 32, medium output 34, and hard output 66. Each setting is one selected run.</desc>
<rect x="0.0" y="0.0" width="1040.0" height="610.0" rx="0" fill="#fbfaf7" stroke="none" />
<text x="28.0" y="38.0" font-family="Inter,Arial,sans-serif" font-size="23px" font-weight="700" fill="#182631" text-anchor="start" >The regex output-length pattern</text>
<text x="28.0" y="66.0" font-family="Inter,Arial,sans-serif" font-size="13px" font-weight="400" fill="#52616d" text-anchor="start" >The diagonal means input and output have the same length; the inset enlarges the 32-character cases.</text>
