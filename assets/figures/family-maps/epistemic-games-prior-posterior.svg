<svg xmlns="http://www.w3.org/2000/svg" width="1260" height="620" viewBox="0 0 1260 620" role="img" aria-labelledby="title desc">
<title id="title">Prior and posterior probabilities for the seven selected epistemic-games cases</title>
<desc id="desc">Each row is one selected case from seed 0. Open circles show the prior probability of World 1; filled diamonds show the judge-credited posterior. Balanced ambiguous cases stay at 1/2, the skewed ambiguous case stays at 3/5, strong evidence shifts the posterior to 1/15, and weak evidence gives 92/177. All seven cases passed under behavioral-reference judging.</desc>
<rect x="0" y="0" width="1260" height="620" fill="#fbfaf7"/>
<text x="28" y="40" font-family="Inter,Arial,sans-serif" font-size="22px" font-weight="700" fill="#182631">Prior and posterior across the seven selected cases</text>
<text x="28" y="68" font-family="Inter,Arial,sans-serif" font-size="12px" font-weight="400" fill="#52616d">One seed-0 run per case · all seven passed under behavioral-reference judging</text>

<circle cx="36" cy="103" r="7" fill="#fbfaf7" stroke="#254f70" stroke-width="2.2"/>
<text x="51" y="107" font-family="Inter,Arial,sans-serif" font-size="11px" fill="#52616d">configured prior</text>
<rect x="191" y="98" width="10" height="10" transform="rotate(45 196 103)" fill="#2a8074" stroke="#1d5b53" stroke-width="1.5"/>
<text x="210" y="107" font-family="Inter,Arial,sans-serif" font-size="11px" fill="#52616d">judge-credited posterior</text>
<line x1="389" y1="103" x2="425" y2="103" stroke="#52616d" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="434" y="107" font-family="Inter,Arial,sans-serif" font-size="11px" fill="#52616d">0.5 reference</text>
<text x="585" y="107" font-family="Inter,Arial,sans-serif" font-size="10px" fill="#52616d">A–G match the configuration rows in the heatmap below.</text>

<text x="28" y="155" font-family="Inter,Arial,sans-serif" font-size="10px" font-weight="700" letter-spacing="0.7px" fill="#52616d">CASE / SINGLE-FACTOR VARIANT</text>
<text x="405" y="155" font-family="Inter,Arial,sans-serif" font-size="10px" font-weight="700" letter-spacing="0.7px" fill="#52616d" text-anchor="middle">PRIOR</text>
<text x="760" y="155" font-family="Inter,Arial,sans-serif" font-size="10px" font-weight="700" letter-spacing="0.7px" fill="#52616d" text-anchor="middle">PROBABILITY OF WORLD 1</text>
<text x="1086" y="155" font-family="Inter,Arial,sans-serif" font-size="10px" font-weight="700" letter-spacing="0.7px" fill="#52616d">POSTERIOR</text>

<rect x="20" y="171" width="1218" height="45" rx="4" fill="#f4f2ed"/>
<rect x="20" y="269" width="1218" height="45" rx="4" fill="#f4f2ed"/>
<rect x="20" y="367" width="1218" height="45" rx="4" fill="#f4f2ed"/>
<rect x="20" y="465" width="1218" height="45" rx="4" fill="#f4f2ed"/>

<line x1="520" y1="171" x2="520" y2="510" stroke="#d5dde2" stroke-width="1"/>
<line x1="640" y1="171" x2="640" y2="510" stroke="#d5dde2" stroke-width="1"/>
<line x1="760" y1="171" x2="760" y2="510" stroke="#254f70" stroke-width="1.5" stroke-dasharray="5 4"/>
<line x1="880" y1="171" x2="880" y2="510" stroke="#d5dde2" stroke-width="1"/>
<line x1="1000" y1="171" x2="1000" y2="510" stroke="#d5dde2" stroke-width="1"/>

<!-- A: report, ambiguous evidence, balanced prior, paired, bare-table -->
<g><title>Case A, base setup: report scenario, ambiguous evidence, balanced prior, paired presentation, bare-table framing. Prior 1/2; posterior 1/2; PASS.</title>
<rect x="28" y="177" width="29" height="32" rx="4" fill="#e8edf0"/>
<text x="42.5" y="198" font-family="Inter,Arial,sans-serif" font-size="11px" font-weight="700" fill="#182631" text-anchor="middle">A</text>
