<text x="24.0" y="39.0" font-family="Inter,Arial,sans-serif" font-size="22px" font-weight="700" fill="#182631" text-anchor="start" >ML debugging · within-family radar</text>
<text x="24.0" y="68.0" font-family="Inter,Arial,sans-serif" font-size="12px" font-weight="400" fill="#52616d" text-anchor="start" >Eligible PASS share by environment; each spoke is one task environment</text>
