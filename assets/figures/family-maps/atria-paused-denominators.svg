<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="860" viewBox="0 0 1120 860" role="img" aria-labelledby="title desc">
  <title id="title">A nearly complete manifest can still contain different kinds of outcomes</title>
  <desc id="desc">Atria-Dawn-Preview with high reasoning effort recorded 415 of 416 manifest cases. Of 415 recorded entries, 290 are scored PASS, 45 scored FAIL, 62 rejected FAIL and 18 unscored FAIL. The last manifest case has no outcome. Separately, 80 exclusion rows outside the manifest have no recorded scores: 56 intervention twins, 14 known gates or calibration, and 10 unsupported modality. This paused snapshot does not estimate general behavioral performance.</desc>
  <style>text{font-family:Arial,Helvetica,sans-serif;fill:#23313a}.muted{fill:#647078}.white{fill:#fff}.mono{font-family:Consolas,'Liberation Mono',monospace}</style>
  <rect width="1120" height="860" fill="#faf9f6"/>
  <text x="40" y="54" font-size="31" font-weight="700">Completion &amp; composition are different questions</text>
  <text x="40" y="88" font-size="20" class="muted">Atria-Dawn-Preview · High reasoning effort · One selected seed-0 case per cell</text>
  <path d="M40 116H1080" stroke="#d9ddd9"/>
  <rect x="40" y="144" width="650" height="124" rx="7" fill="#e8eeea"/>
  <text x="64" y="177" font-size="20" font-weight="700">416 manifest cases</text>
  <text x="64" y="231" font-size="45" font-weight="700">415</text>
  <text x="155" y="224" font-size="23">recorded outcomes</text>
  <text x="155" y="250" font-size="18" class="muted">290 PASS + 125 FAIL</text>
  <rect x="714" y="144" width="366" height="124" rx="7" fill="#faf3e1" stroke="#b99341"/>
  <text x="738" y="177" font-size="20" font-weight="700">1 outcome still absent</text>
  <text x="738" y="211" font-size="19" class="mono">ts_trajectory · reflective</text>
  <text x="738" y="245" font-size="19" class="muted">Neither PASS nor FAIL</text>
  <text x="40" y="315" font-size="24" font-weight="700">What the 415 recorded entries contain</text>
  <text x="40" y="345" font-size="19" class="muted">Segment widths count entries; final verdicts and dispositions are kept together.</text>
  <rect x="40" y="369" width="726.747" height="64" fill="#197d70"/>
  <rect x="766.747" y="369" width="112.771" height="64" fill="#be735c"/>
  <rect x="879.518" y="369" width="155.373" height="64" fill="#915443"/>
  <rect x="1034.891" y="369" width="45.109" height="64" fill="#b99341"/>
  <g font-size="24" font-weight="700" text-anchor="middle"><text x="403.374" y="410" class="white">290</text><text x="823.133" y="410" class="white">45</text><text x="957.205" y="410" class="white">62</text><text x="1057.446" y="410" class="white">18</text></g>
  <path d="M40 445V456H879.518V445" fill="none" stroke="#647078"/>
  <text x="459.759" y="483" text-anchor="middle" font-size="19" class="muted">335 scored dispositions</text>
  <g font-size="20"><rect x="40" y="512" width="18" height="18" fill="#197d70"/><text x="70" y="529">290 scored PASS</text><rect x="580" y="512" width="18" height="18" fill="#be735c"/><text x="610" y="529">45 scored FAIL</text><rect x="40" y="552" width="18" height="18" fill="#915443"/><text x="70" y="569">62 rejected FAIL</text><rect x="580" y="552" width="18" height="18" fill="#b99341"/><text x="610" y="569">18 unscored FAIL</text></g>
  <path d="M40 605H1080" stroke="#d9ddd9" stroke-dasharray="6 6"/>
  <rect x="40" y="631" width="1040" height="128" rx="7" fill="#f0f0ec"/>
  <text x="64" y="668" font-size="24" font-weight="700">80 exclusions sit outside the manifest</text>
  <text x="64" y="702" font-size="20">56 intervention twins + 14 known gates / calibration + 10 unsupported modality</text>
  <text x="64" y="735" font-size="19" class="muted">No recorded scores. These are a separate set from the 62 + 18 recorded FAILs above.</text>
  <rect x="40" y="789" width="5" height="42" fill="#b99341"/>
  <text x="62" y="809" font-size="20" font-weight="700">290/415 = 69.9% is a recorded-verdict fraction.</text>
  <text x="62" y="835" font-size="18" class="muted">Paused snapshot; mixed judge guarantees; no independent replication or verified clean-source execution.</text>
</svg>
