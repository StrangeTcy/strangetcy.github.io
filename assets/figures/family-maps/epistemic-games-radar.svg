<svg xmlns="http://www.w3.org/2000/svg" width="960" height="755" viewBox="0 0 960 755" role="img" aria-labelledby="title desc">
<title id="title">Epistemic games within-family radar chart</title>
<desc id="desc">Radar radius is the pass fraction among performance-eligible rows, on a zero-to-one-hundred-percent scale. Marker shapes distinguish behavioral-reference from compile-only judge modes. Numbered spokes match the adjacent heatmap order; this is descriptive, not a cross-family score.</desc>
