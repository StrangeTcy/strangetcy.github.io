<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="750" viewBox="0 0 1120 750" role="img" aria-labelledby="title desc">
<title id="title">Mercury failure labels separated by recorded judge guarantee</title>
<desc id="desc">Of 128 scored FAIL cases, underfit has 5 behavioral-reference and 46 compile-only cases; overfit-visible-tests has 38 and 11; runtime-error has zero and 11; source-invalid has zero and 9; invalid-action has 3 and 2; training-failed has 2 and 1. The guarantee totals are 48 and 80. Eleven infrastructure-unscored cases are outside the 128 failures. Recorded labels and guarantees are not independently verified mechanisms or implementations.</desc>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#23313a}.muted{fill:#647078}.white{fill:#fff}.mono{font-family:Consolas,'Liberation Mono',monospace}</style>
<rect width="1120" height="750" fill="#faf9f6"/>
<text x="40" y="53" font-size="32" font-weight="700">128 failures, six labels, two guarantee values</text>
<text x="40" y="88" font-size="20" class="muted">Mercury-2.5 · Counts among scored FAIL cases · 11 infrastructure-unscored cases excluded</text>
<path d="M40 114H1080" stroke="#d9ddd9"/>
<rect x="40" y="138" width="19" height="19" rx="3" fill="#197d70"/><text x="70" y="154" font-size="18">behavioral_reference · 48</text>
<rect x="421" y="138" width="19" height="19" rx="3" fill="#b99341"/><text x="451" y="154" font-size="18">compile_only · 80</text>
<g class="mono" font-size="18"><text x="40" y="224">underfit</text><text x="40" y="287">overfit_visible_tests</text><text x="40" y="350">runtime_error</text><text x="40" y="413">source_invalid</text><text x="40" y="476">invalid_action</text><text x="40" y="539">training_failed</text></g>
<g fill="#e6e9e5"><rect x="322" y="201" width="561" height="34" rx="3"/><rect x="322" y="264" width="561" height="34" rx="3"/><rect x="322" y="327" width="561" height="34" rx="3"/><rect x="322" y="390" width="561" height="34" rx="3"/><rect x="322" y="453" width="561" height="34" rx="3"/><rect x="322" y="516" width="561" height="34" rx="3"/></g>
<g fill="#197d70"><rect x="322" y="201" width="55" height="34"/><rect x="322" y="264" width="418" height="34"/><rect x="322" y="453" width="33" height="34"/><rect x="322" y="516" width="22" height="34"/></g>
<g fill="#b99341"><rect x="377" y="201" width="506" height="34"/><rect x="740" y="264" width="121" height="34"/><rect x="322" y="327" width="121" height="34"/><rect x="322" y="390" width="99" height="34"/><rect x="355" y="453" width="22" height="34"/><rect x="344" y="516" width="11" height="34"/></g>
<g font-size="21" font-weight="700"><text x="916" y="225">5 + 46 = 51</text><text x="916" y="288">38 + 11 = 49</text><text x="916" y="351">0 + 11 = 11</text><text x="916" y="414">0 + 9 = 9</text><text x="916" y="477">3 + 2 = 5</text><text x="916" y="540">2 + 1 = 3</text></g>
<path d="M322 572H883" stroke="#aeb7b4"/>
<g font-size="17" text-anchor="middle" class="muted"><text x="322" y="597">0</text><text x="487" y="597">15</text><text x="652" y="597">30</text><text x="817" y="597">45</text></g>
<text x="893" y="597" font-size="17" class="muted">cases</text>
<rect x="40" y="635" width="5" height="79" fill="#b99341"/>
<text x="63" y="661" font-size="22" font-weight="700">A label organizes inspection. It does not demonstrate a mechanism.</text>
<text x="63" y="691" font-size="18" class="muted">Guarantees are recorded fields, not independently reverified judge implementations.</text>
<text x="63" y="717" font-size="18" class="muted">In particular, 49 “overfit_visible_tests” labels do not establish 49 cases of intentional gaming.</text>
</svg>
