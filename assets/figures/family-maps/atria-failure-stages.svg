  <text x="133" y="617" font-size="18" class="mono">38 underfit</text>
  <rect x="576" y="572" width="210" height="44" rx="5" fill="#e7d6ad"/><rect x="826" y="572" width="230" height="44" rx="5" fill="#be735c"/>
