<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="990" viewBox="0 0 1120 990" role="img" aria-labelledby="title desc">
  <title id="title">The same final FAIL records different evaluation stages</title>
  <desc id="desc">The 125 final FAILs in the paused Atria-Dawn-Preview high-reasoning snapshot: 62 rejected rows have runtime and behavioral evaluation not reached. Twelve unscored execution failures have runtime failed and behavioral evaluation not reached. Six invalid-action rows have both stages unknown. Thirty-eight scored underfit rows have runtime unknown and behavioral scored fail. Seven scored overfit-visible-tests rows have runtime passed, with six behavioral scored fail and one behavioral scored pass. Thus 74 behavioral evaluations are not reached, six are unknown and 45 have component outcomes. Labels are not causal diagnoses or independently verified execution traces; 80 outside-manifest exclusions are not part of this partition.</desc>
