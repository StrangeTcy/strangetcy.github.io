  <text x="40" y="862" font-size="19" class="muted">62 rejected rows stay in the end-to-end tally; they provide no repaired-code behavior.</text>
  <text x="40" y="896" font-size="18">*The component-pass row is exploratory compile_only; required artifacts failed; final verdict is FAIL.</text>
  <text x="40" y="926" font-size="18" class="muted">Component outcomes mix judge guarantees. The aggregation rule and executed source remain unverified.</text>
  <text x="40" y="956" font-size="18" class="muted">The 80 exclusions outside the manifest are separate from all 125 recorded FAILs shown here.</text>
