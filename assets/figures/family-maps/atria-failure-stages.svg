  <text x="580" y="159" font-size="20" font-weight="700">Runtime execution</text>
  <text x="826" y="159" font-size="20" font-weight="700">Behavioral evaluation</text>
  <rect x="40" y="184" width="1040" height="102" rx="6" fill="#f4e8e2"/>
  <text x="62" y="225" font-size="35" font-weight="700">62</text><text x="133" y="221" font-size="23" font-weight="700">rejected</text>
  <text x="133" y="257" font-size="18" class="mono">45 patch_invalid · 17 source_invalid</text>
  <rect x="576" y="212" width="210" height="44" rx="5" fill="#915443"/><rect x="826" y="212" width="230" height="44" rx="5" fill="#915443"/>
  <text x="681" y="241" text-anchor="middle" font-size="20" class="mono white">not_reached</text><text x="941" y="241" text-anchor="middle" font-size="20" class="mono white">not_reached</text>
  <rect x="40" y="304" width="1040" height="102" rx="6" fill="#f4e8e2"/>
  <text x="62" y="345" font-size="35" font-weight="700">12</text><text x="133" y="341" font-size="23" font-weight="700">unscored · execution failure</text>
  <text x="133" y="377" font-size="18" class="mono">11 training_failed · 1 runtime_error</text>
