<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="780" viewBox="0 0 1120 780" role="img" aria-labelledby="title desc"><title id="title">What is included in each judge guarantee denominator?</title><desc id="desc">Behavioral-reference cases include 131 scored PASS, 12 scored FAIL, 33 rejected FAIL, and 13 unscored FAIL, total 189. Compile-only cases include 159 scored PASS, 33 scored FAIL, 29 rejected FAIL, and 5 unscored FAIL, total 226. All 415 recorded verdicts comprise 290 PASS, 45 scored FAIL, 62 rejected FAIL and 18 unscored FAIL. One additional manifest case has no recorded result and is not in either bar.</desc><style>text{font-family:Arial,Helvetica,sans-serif;fill:#23313a}.muted{fill:#647078}.bold{font-weight:700}.white{fill:white}.white text{fill:white}.dark{fill:#23313a!important}</style><rect width="1120" height="780" fill="#faf9f6"/>
<text x="40" y="53" font-size="31" class="bold">A denominator includes the path to the verdict</text><text x="40" y="88" font-size="20" class="muted">Atria-Dawn-Preview · share of recorded rows within each guarantee pool</text><path d="M40 115H1080" stroke="#d9ddd9"/>
<rect x="40" y="141" width="17" height="17" fill="#197d70"/><text x="66" y="156" font-size="19">Scored PASS</text><rect x="296" y="141" width="17" height="17" fill="#b54c41"/><text x="322" y="156" font-size="19">Scored FAIL</text><rect x="550" y="141" width="17" height="17" fill="#b99341"/><text x="576" y="156" font-size="19">Rejected FAIL</text><rect x="824" y="141" width="17" height="17" fill="#838c91"/><text x="850" y="156" font-size="19">Unscored FAIL</text>
<text x="40" y="217" font-size="24" class="bold">behavioral_reference</text><text x="1080" y="217" font-size="23" class="bold" text-anchor="end">189 recorded rows</text>
<rect x="40" y="238" width="720.85" height="72" fill="#197d70"/><rect x="760.85" y="238" width="66.03" height="72" fill="#b54c41"/><rect x="826.88" y="238" width="181.59" height="72" fill="#b99341"/><rect x="1008.47" y="238" width="71.53" height="72" fill="#838c91"/>
<g class="bold white" font-size="27" text-anchor="middle"><text x="400.43" y="284">131</text><text x="793.87" y="284">12</text><text x="917.68" y="284" class="dark">33</text><text x="1044.23" y="284">13</text></g>
<text x="40" y="341" font-size="20" class="muted">58 final FAILs = 12 scored + 33 rejected + 13 unscored</text>
<text x="40" y="402" font-size="24" class="bold">compile_only</text><text x="1080" y="402" font-size="23" class="bold" text-anchor="end">226 recorded rows</text>
<rect x="40" y="423" width="731.68" height="72" fill="#197d70"/><rect x="771.68" y="423" width="151.86" height="72" fill="#b54c41"/><rect x="923.54" y="423" width="133.45" height="72" fill="#b99341"/><rect x="1056.99" y="423" width="23.01" height="72" fill="#838c91"/>
<g class="bold white" font-size="27" text-anchor="middle"><text x="405.84" y="469">159</text><text x="847.61" y="469">33</text><text x="990.26" y="469" class="dark">29</text></g><path d="M1068.5 495V514H1008" fill="none" stroke="#647078" stroke-width="1.5"/><text x="997" y="522" font-size="20" class="bold" text-anchor="end">5 unscored</text>
<text x="40" y="543" font-size="20" class="muted">67 final FAILs = 33 scored + 29 rejected + 5 unscored</text>
<path d="M40 573H1080" stroke="#d9ddd9"/>
<text x="40" y="613" font-size="24" class="bold">All 415 recorded verdicts: 290 PASS + 125 FAIL</text><text x="40" y="648" font-size="20" class="muted">All 62 rejected rows explicitly record behavioral evaluation not reached.</text><text x="40" y="679" font-size="20" class="muted">“Unscored FAIL” is the recorded disposition/verdict combination; it is not a missing row.</text><text x="40" y="722" font-size="20" class="bold">1 of the 416 manifest cases has no recorded result.</text><text x="40" y="752" font-size="18" class="muted">That case enters neither denominator. Both bars total 100% of their own recorded pool.</text></svg>